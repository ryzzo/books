<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Summary</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <button class="secondary" onclick="window.location.href='/'">&larr; Back to search</button>

  <p id="loading">Searching...</p>
  <p id="error"></p>
  <div id="suggestions"></div>

  <div id="result">
    <h2 id="result-title"></h2>
    <p id="result-summary"></p>
    <a id="result-link" target="_blank" rel="noopener noreferrer">View on Wikipedia</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get("title");

    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("error");
    const suggestionsEl = document.getElementById("suggestions");
    const resultEl = document.getElementById("result");
    const resultTitle = document.getElementById("result-title");
    const resultSummary = document.getElementById("result-summary");
    const resultLink = document.getElementById("result-link");

    function showSuggestions(suggestions) {
      if (!suggestions || suggestions.length === 0) return;
      const heading = document.createElement("p");
      heading.textContent = "Did you mean:";
      suggestionsEl.appendChild(heading);

      const list = document.createElement("ul");
      suggestions.forEach((s) => {
        const li = document.createElement("li");
        const link = document.createElement("a");
        link.href = "/result.html?title=" + encodeURIComponent(s);
        link.textContent = s;
        li.appendChild(link);
        list.appendChild(li);
      });
      suggestionsEl.appendChild(list);
    }

    async function loadSummary() {
      if (!title) {
        errorEl.textContent = "No book title provided.";
        errorEl.style.display = "block";
        return;
      }

      loadingEl.style.display = "block";
      try {
        const response = await fetch("/books/summary", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title }),
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          const detail = data.detail;
          const message = typeof detail === "string" ? detail : detail?.message;
          const err = new Error(message || `Request failed (${response.status})`);
          err.suggestions = typeof detail === "object" ? detail?.suggestions : null;
          throw err;
        }

        const data = await response.json();
        resultTitle.textContent = data.title;
        resultSummary.textContent = data.summary || "No summary available.";
        if (data.url) {
          resultLink.href = data.url;
          resultLink.style.display = "inline";
        } else {
          resultLink.style.display = "none";
        }
        resultEl.style.display = "block";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
        showSuggestions(err.suggestions);
      } finally {
        loadingEl.style.display = "none";
      }
    }

    loadSummary();
  </script>
</body>
</html>
