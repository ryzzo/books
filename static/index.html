<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Summary</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <h1>Book Summary Lookup</h1>
  <form id="search-form">
    <input id="title-input" type="text" placeholder="e.g. The Hobbit" autocomplete="off" required />
    <button type="submit">Search</button>
  </form>

  <script>
    document.getElementById("search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const title = document.getElementById("title-input").value.trim();
      if (!title) return;
      window.location.href = "/result.html?title=" + encodeURIComponent(title);
    });
  </script>
</body>
</html>
